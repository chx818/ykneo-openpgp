# =============================================================================
#  ykneo-openpgp -> OpenPGP applet CAP 自动编译  +  密码学能力探针
#
#  用法：把本文件放到 fork 的 .github/workflows/build-cap.yml
#        push 到 master/main，或者在 Actions 页面点 "Run workflow"
#
#  三个 job：
#    cap-jc222-upstream : 上游原生 Ant 构建，Java Card 2.2.2 目标（最稳）
#    cap-antjavacard    : ant-javacard，同一个源出 2.2.2 / 3.0.5 两个 CAP
#    probe-caps         : 9 个极小探针 applet，用来问清楚这张卡支持哪些算法
#                         卡不支持 -> INSTALL 时抛 CryptoException -> 返回 6F00
#                         卡支持   -> 安装成功
# =============================================================================

name: Build OpenPGP CAP

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Oracle 官方 Java Card SDK 的重打包仓库（含 jc222_kit / jc305u4_kit 等）
  SDK_REPO: https://github.com/martinpaljak/oracle_javacard_sdks.git
  ANT_JAVACARD_JAR: https://github.com/martinpaljak/ant-javacard/releases/latest/download/ant-javacard.jar

jobs:
  # ---------------------------------------------------------------------------
  # 方案一：上游 Yubico 的原生 Ant 构建（Java Card 2.2.2 SDK + 项目自带 build.xml）
  #         build.xml 读的是 -DJAVACARD_HOME=<kit 目录>
  # ---------------------------------------------------------------------------
  cap-jc222-upstream:
    name: CAP target JavaCard 2.2.2 (upstream ant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须 JDK 8：build.xml 里写死了 source/target=1.5，高版本 javac 不认
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch Oracle JavaCard SDKs (CI repack)
        run: |
          git clone --depth 1 "$SDK_REPO" sdks
          ls sdks

      - name: Build with ant
        run: ant -DJAVACARD_HOME="$PWD/sdks/jc222_kit"

      - name: Collect CAP
        run: |
          ls -l applet/bin/openpgpcard/javacard/
          cp applet/bin/openpgpcard/javacard/openpgpcard.cap openpgpcard-jc222.cap

      - name: Upload CAP
        uses: actions/upload-artifact@v4
        with:
          name: openpgpcard-jc222
          path: openpgpcard-jc222.cap
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 方案二：ant-javacard，同一个源出两个目标平台的 CAP
  # ---------------------------------------------------------------------------
  cap-antjavacard:
    name: CAP target JavaCard 2.2.2 + 3.0.5 (ant-javacard)
    runs-on: ubuntu-latest
    # 这个 applet 是 2012~2015 年为 JC 2.2.2 写的，用 3.0.5 API 编译时
    # 个别算法常量可能不存在；这一路失败不影响上面的 jc222 产物
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch ant-javacard and SDKs
        run: |
          curl -fsSL -o ant-javacard.jar "$ANT_JAVACARD_JAR"
          git clone --depth 1 "$SDK_REPO" sdks
          ls -l ant-javacard.jar

      - name: Show toolchain versions
        run: |
          java -version
          javac -version
          ant -version
          ls sdks

      - name: Build CAPs
        run: ant -f build-cap.xml all

      - name: List results
        run: ls -l *.cap

      - name: Upload CAPs
        uses: actions/upload-artifact@v4
        with:
          name: openpgpcard-jc222-jc305
          path: "*.cap"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 方案三：密码学能力探针（诊断"阉割卡"）
  #         Artifacts -> probe-caps -> 9 个 probe-pN-*.cap
  #         逐个安装，哪个装得上就说明卡支持那项能力
  # ---------------------------------------------------------------------------
  probe-caps:
    name: Crypto probe CAPs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch ant-javacard and SDKs
        run: |
          curl -fsSL -o ant-javacard.jar "$ANT_JAVACARD_JAR"
          git clone --depth 1 "$SDK_REPO" sdks

      - name: Build probes
        run: ant -f build-probe.xml all

      - name: List results
        run: ls -l probe-*.cap

      - name: Upload probes
        uses: actions/upload-artifact@v4
        with:
          name: probe-caps
          path: "probe-*.cap"
          if-no-files-found: error
