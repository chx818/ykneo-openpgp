name: Build OpenPGP CAP

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 递归拉取子模块（解决找不到 ant-javacard 的问题）
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 使用最新版 setup-java@v5 并固定 JDK 8
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      # 3. 安装 Ant 工具
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      # 4. 下载 JavaCard 3.0.4 SDK
      - name: Download JavaCard SDK
        run: |
          curl -L -o jcsdk.zip https://github.com/martinpaljak/oracle_javacard_sdks/archive/refs/heads/master.zip
          unzip -q jcsdk.zip
          echo "JC_HOME=$GITHUB_WORKSPACE/oracle_javacard_sdks-master/jc304_kit" >> $GITHUB_ENV

      # 5. 编译并打印详细日志（若失败方便定位）
      - name: Build with Ant
        run: |
          ant -verbose -Djc.home="$JC_HOME"

      # 6. 上传生成的 CAP 产物
      - name: Upload CAP File
        uses: actions/upload-artifact@v4
        with:
          name: openpgp-cap
          path: "**/*.cap"
