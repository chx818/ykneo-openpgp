name: Build OpenPGP CAP

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      # 下载标准的 JavaCard 2.2.2 SDK（完全契合旧版 ant 脚本与 api.jar 路径）
      - name: Download JavaCard 2.2.2 SDK
        run: |
          curl -L -o jcsdk.zip https://github.com/martinpaljak/oracle_javacard_sdks/archive/refs/heads/master.zip
          unzip -q jcsdk.zip
          # 2.2.2 的目录命名通常为 jc222_kit
          echo "JC_HOME=$GITHUB_WORKSPACE/oracle_javacard_sdks-master/jc222_kit" >> $GITHUB_ENV

      # 同时传递 -Djc.home 与环境变量 JC_HOME，并确保类路径可被识别
      - name: Build with Ant
        run: |
          ant -Djc.home="$JC_HOME" -DJC_HOME="$JC_HOME"

      - name: Upload CAP File
        uses: actions/upload-artifact@v4
        with:
          name: openpgp-cap
          path: "**/*.cap"
