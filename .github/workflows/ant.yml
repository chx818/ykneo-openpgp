# =============================================================================
#  ykneo-openpgp -> OpenPGP applet CAP 自动编译  +  密码学能力探针
#
#  用法：把本文件放到 fork 的 .github/workflows/build-cap.yml
#        push 到 master/main，或者在 Actions 页面点 "Run workflow"
#
#  三个 job：
#    cap-jc222-upstream : 上游原生 Ant 构建，Java Card 2.2.2 目标（最稳）
#    cap-antjavacard    : ant-javacard，同一个源出 2.2.2 / 3.0.5 两个 CAP
#    probe-caps         : 11 个极小探针 applet，用来问清楚这张卡支持哪些算法（源码内联在本文件里）
#    probe2-caps        : 第二轮 7 个探针，专查 RSA 缺哪一层 + ECC 有没有
#                         卡不支持 -> INSTALL 时抛 CryptoException -> 返回 6F00
#                         卡支持   -> 安装成功
# =============================================================================

name: Build OpenPGP CAP

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Oracle 官方 Java Card SDK 的重打包仓库（含 jc222_kit / jc305u4_kit 等）
  SDK_REPO: https://github.com/martinpaljak/oracle_javacard_sdks.git
  ANT_JAVACARD_JAR: https://github.com/martinpaljak/ant-javacard/releases/latest/download/ant-javacard.jar

jobs:
  # ---------------------------------------------------------------------------
  # 方案一：上游 Yubico 的原生 Ant 构建（Java Card 2.2.2 SDK + 项目自带 build.xml）
  #         build.xml 读的是 -DJAVACARD_HOME=<kit 目录>
  # ---------------------------------------------------------------------------
  cap-jc222-upstream:
    name: CAP target JavaCard 2.2.2 (upstream ant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须 JDK 8：build.xml 里写死了 source/target=1.5，高版本 javac 不认
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch Oracle JavaCard SDKs (CI repack)
        run: |
          git clone --depth 1 "$SDK_REPO" sdks
          ls sdks

      - name: Build with ant
        run: ant -DJAVACARD_HOME="$PWD/sdks/jc222_kit"

      - name: Collect CAP
        run: |
          ls -l applet/bin/openpgpcard/javacard/
          cp applet/bin/openpgpcard/javacard/openpgpcard.cap openpgpcard-jc222.cap

      - name: Upload CAP
        uses: actions/upload-artifact@v4
        with:
          name: openpgpcard-jc222
          path: openpgpcard-jc222.cap
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 方案二：ant-javacard，同一个源出两个目标平台的 CAP
  # ---------------------------------------------------------------------------
  cap-antjavacard:
    name: CAP target JavaCard 2.2.2 + 3.0.5 (ant-javacard)
    runs-on: ubuntu-latest
    # 这个 applet 是 2012~2015 年为 JC 2.2.2 写的，用 3.0.5 API 编译时
    # 个别算法常量可能不存在；这一路失败不影响上面的 jc222 产物
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch ant-javacard and SDKs
        run: |
          curl -fsSL -o ant-javacard.jar "$ANT_JAVACARD_JAR"
          git clone --depth 1 "$SDK_REPO" sdks
          ls -l ant-javacard.jar

      - name: Show toolchain versions
        run: |
          java -version
          javac -version
          ant -version
          ls sdks

      - name: Build CAPs
        run: ant -f build-cap.xml all

      - name: List results
        run: ls -l *.cap

      - name: Upload CAPs
        uses: actions/upload-artifact@v4
        with:
          name: openpgpcard-jc222-jc305
          path: "*.cap"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 方案三：密码学能力探针（诊断"阉割卡"）
  #         Artifacts -> probe-caps -> 11 个 probe-*.cap
  #         逐个安装，哪个装得上就说明卡支持那项能力
  # ---------------------------------------------------------------------------
  probe-caps:
    name: Crypto probe CAPs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch ant-javacard and SDKs
        run: |
          curl -fsSL -o ant-javacard.jar "$ANT_JAVACARD_JAR"
          git clone --depth 1 "$SDK_REPO" sdks

      # 探针源码 / build-probe.xml 都由下面这步生成，仓库里有旧版本会被覆盖，
      # 所以不需要手动同步 Java 文件，也不会再有 BOM / 常量名不同步的问题
      - name: Generate probe sources and build file
        run: |
          mkdir -p probe/src
          mkdir -p probe/src/p0null
          cat > probe/src/p0null/Null0.java <<'JCEOF'
          package p0null;

          import javacard.framework.APDU;
          import javacard.framework.Applet;
          import javacard.framework.ISO7816;
          import javacard.framework.ISOException;
          import javacard.security.KeyBuilder;
          import javacard.security.KeyPair;
          import javacard.security.MessageDigest;
          import javacard.security.RandomData;
          import javacard.security.Signature;
          import javacardx.crypto.Cipher;

          // 探针 P0 : 对照组，什么都不做
          // 这段代码在 applet 实例被构造时执行（也就是 INSTALL 的时候）。
          // 卡支持 -> install 成功(9000)；卡不支持 -> 抛 CryptoException -> install 返回 6F00。
          public class Null0 extends Applet {

              private Null0() {
                  // 空探针
              }

              public static void install(byte[] bArray, short bOffset, byte bLength) {
                  new Null0().register(bArray, (short) (bOffset + 1), bArray[bOffset]);
              }

              public void process(APDU apdu) {
                  if (selectingApplet()) {
                      return;
                  }
                  ISOException.throwIt(ISO7816.SW_INS_NOT_SUPPORTED);
              }
          }

          JCEOF
          mkdir -p probe/src/p1rsa1024crt
          cat > probe/src/p1rsa1024crt/Rsa1024Crt.java <<'JCEOF'
          package p1rsa1024crt;

          import javacard.framework.APDU;
          import javacard.framework.Applet;
          import javacard.framework.ISO7816;
          import javacard.framework.ISOException;
          import javacard.security.KeyBuilder;
          import javacard.security.KeyPair;
          import javacard.security.MessageDigest;
          import javacard.security.RandomData;
          import javacard.security.Signature;
          import javacardx.crypto.Cipher;

          // 探针 P1 : RSA-CRT 1024 密钥对象
          // 这段代码在 applet 实例被构造时执行（也就是 INSTALL 的时候）。
          // 卡支持 -> install 成功(9000)；卡不支持 -> 抛 CryptoException -> install 返回 6F00。
          public class Rsa1024Crt extends Applet {

              private Rsa1024Crt() {
                  new KeyPair(KeyPair.ALG_RSA_CRT, (short) 1024);
              }

              public static void install(byte[] bArray, short bOffset, byte bLength) {
                  new Rsa1024Crt().register(bArray, (short) (bOffset + 1), bArray[bOffset]);
              }

              public void process(APDU apdu) {
                  if (selectingApplet()) {
                      return;
                  }
                  ISOException.throwIt(ISO7816.SW_INS_NOT_SUPPORTED);
              }
          }

          JCEOF
          mkdir -p probe/src/p2rsa2048crt
          cat > probe/src/p2rsa2048crt/Rsa2048Crt.java <<'JCEOF'
