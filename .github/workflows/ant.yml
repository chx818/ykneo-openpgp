name: Build OpenPGP CAP

on:
  workflow_dispatch: # 让你可以在网页上手动点按钮触发构建
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 必须降级到 JDK 8，否则 JavaCard 转换器必崩
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # 2. 安装 Ant 工具
    - name: Set up Ant
      run: sudo apt-get update && sudo apt-get install -y ant

    # 3. 自动拉取 JavaCard SDK 3.0.4 并注入环境变量
    - name: Download JavaCard SDK
      run: |
        curl -L -o jcsdk.zip https://github.com/martinpaljak/oracle_javacard_sdks/archive/refs/heads/master.zip
        unzip -q jcsdk.zip
        echo "JC_HOME=$GITHUB_WORKSPACE/oracle_javacard_sdks-master/jc304_kit" >> $GITHUB_ENV

    # 4. 执行编译（把 JC_HOME 传给 Ant）
    - name: Build with Ant
      run: ant -Djc.home=$JC_HOME

    # 5. 把生成的 .cap 文件作为产物上传，供你在网页上直接下载
    - name: Upload CAP File
      uses: actions/upload-artifact@v4
      with:
        name: openpgp-cap
        path: "**/*.cap"
