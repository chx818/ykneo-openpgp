name: Build ykneo-openpgp

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      # 直接利用社区预封装的 javacard gradle 插件一键构建，自动拉取 SDK
      - name: Build CAP using Gradle
        run: |
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.github.martinpaljak.clConsistent' version '0.0.1' apply false
          }
          apply plugin: 'java'

          repositories {
              mavenCentral()
              maven { url 'https://javacard.pro/maven' }
          }

          // 直接使用 JavaCard 2.2.2 官方编译库
          dependencies {
              compileOnly 'com.klinec:javacard-2.2.2:1.0'
          }
          EOF

      # 备用方案：如果用 Ant，确保把正确的 api.jar 加入环境变量
      - name: Setup Ant Environment and Build
        run: |
          sudo apt-get update && sudo apt-get install -y ant
          curl -L -o jcsdk.zip https://github.com/martinpaljak/oracle_javacard_sdks/archive/refs/heads/master.zip
          unzip -q jcsdk.zip
          export JC_HOME=$GITHUB_WORKSPACE/oracle_javacard_sdks-master/jc222_kit
          # 关键点：将 api.jar 显式注入 Ant 的 CLASSPATH
          ant -Djc.home=$JC_HOME -lib $JC_HOME/lib/api.jar

      - name: Upload CAP File
        uses: actions/upload-artifact@v4
        with:
          name: openpgp-cap
          path: "**/*.cap"
