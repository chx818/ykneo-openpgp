name: Build OpenPGP CAP

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      # 关键步骤：精准下载 JavaCard 2.2.2 并提取构建所需的环境
      - name: Setup JavaCard SDK
        run: |
          curl -L -o jcsdk.zip https://github.com/martinpaljak/oracle_javacard_sdks/archive/refs/heads/master.zip
          unzip -q jcsdk.zip
          
          # 创建一个标准 SDK 根目录
          mkdir -p $GITHUB_WORKSPACE/javacard_home/lib
          
          # 兼容不同 SDK 版本，优先复制 jc222 或提取 api.jar
          if [ -d "$GITHUB_WORKSPACE/oracle_javacard_sdks-master/jc222_kit" ]; then
            cp -r $GITHUB_WORKSPACE/oracle_javacard_sdks-master/jc222_kit/* $GITHUB_WORKSPACE/javacard_home/
          fi
          
          # 确保 lib/api.jar 绝对存在（ykneo 的 build.xml 强依赖这个路径）
          find $GITHUB_WORKSPACE/oracle_javacard_sdks-master/ -name "api.jar" -exec cp {} $GITHUB_WORKSPACE/javacard_home/lib/api.jar \;
          
          # 注入给全局环境变量（build.xml 读取的是 env.JC_HOME）
          echo "JC_HOME=$GITHUB_WORKSPACE/javacard_home" >> $GITHUB_ENV

      # 编译：同时传入环境变量与系统属性
      - name: Build with Ant
        run: |
          ant -Denv.JC_HOME="$JC_HOME" -DJC_HOME="$JC_HOME" -Djc.home="$JC_HOME"

      # 收集打包产物
      - name: Upload CAP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openpgp-cap
          path: |
            **/*.cap
            applet/bin/**/*.cap
