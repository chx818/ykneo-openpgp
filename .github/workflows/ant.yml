                      return;
                  }
                  ISOException.throwIt(ISO7816.SW_INS_NOT_SUPPORTED);
              }
          }

          JCEOF
          mkdir -p probe/src/p5digests
          cat > probe/src/p5digests/Digests.java <<'JCEOF'
