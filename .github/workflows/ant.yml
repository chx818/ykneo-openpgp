          // 探针 P12 : RSA 私钥对象 2048（modulus/exponent 形式）
          // 只看 KeyBuilder 能不能造出这种密钥对象；造不出来 = 卡没有这种非对称密钥能力。
          public class RsaPriv2048 extends Applet {

              private RsaPriv2048() {
                  KeyBuilder.buildKey(KeyBuilder.TYPE_RSA_PRIVATE, KeyBuilder.LENGTH_RSA_2048, false);
              }

              public static void install(byte[] bArray, short bOffset, byte bLength) {
