  # ---------------------------------------------------------------------------
  # 方案四：第二轮探针（RSA 到底缺哪一层 + ECC 有没有）
  #         Artifacts -> probe2-caps -> 7 个 probe2-*.cap
  # ---------------------------------------------------------------------------
  probe2-caps:
    name: Crypto probe CAPs round 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Fetch ant-javacard and SDKs
        run: |
          curl -fsSL -o ant-javacard.jar "$ANT_JAVACARD_JAR"
          git clone --depth 1 "$SDK_REPO" sdks

      - name: Generate round-2 probe sources
        run: |
          mkdir -p probe/src
          mkdir -p probe/src/p11rsapub2048
          cat > probe/src/p11rsapub2048/RsaPub2048.java <<'JCEOF'
          package p11rsapub2048;

          import javacard.framework.APDU;
          import javacard.framework.Applet;
          import javacard.framework.ISO7816;
          import javacard.framework.ISOException;
          import javacard.security.KeyBuilder;

          // 探针 P11 : RSA 公钥对象 2048（只验签用的那种）
          // 只看 KeyBuilder 能不能造出这种密钥对象；造不出来 = 卡没有这种非对称密钥能力。
          public class RsaPub2048 extends Applet {

              private RsaPub2048() {
                  KeyBuilder.buildKey(KeyBuilder.TYPE_RSA_PUBLIC, KeyBuilder.LENGTH_RSA_2048, false);
              }

              public static void install(byte[] bArray, short bOffset, byte bLength) {
                  new RsaPub2048().register(bArray, (short) (bOffset + 1), bArray[bOffset]);
              }

              public void process(APDU apdu) {
                  if (selectingApplet()) {
                      return;
                  }
                  ISOException.throwIt(ISO7816.SW_INS_NOT_SUPPORTED);
              }
          }
          JCEOF
          mkdir -p probe/src/p12rsapriv2048
          cat > probe/src/p12rsapriv2048/RsaPriv2048.java <<'JCEOF'
          package p12rsapriv2048;

